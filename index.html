<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وصيانة الكومباوند | Compound Maintenance</title>
    <link rel="stylesheet" href="property-management.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="pm-app">
        <aside class="sidebar">
            <h2><i class="fa-solid fa-screws-all"></i> صيانة<span>الكومباوند</span></h2>
            <div class="user-info">الساكن: د. أحمد زويل - وحدة B-402</div>
            <button class="btn-new" id="openTicketModal"><i class="fa-solid fa-plus"></i> طلب صيانة جديد</button>
        </aside>
        <main class="main-content">
            <h3>طلبات الصيانة الخاصة بك</h3>
            <div class="tickets-grid" id="ticketsGrid">
                <div class="ticket-card">
                    <span class="status pending">قيد الانتظار</span>
                    <h4>تسريب مياه بالحديقة</h4>
                    <p>القسم: سباكة وخارجية</p>
                    <small>تاريخ الطلب: 4 أغسطس 2026</small>
                </div>
            </div>
        </main>
    </div>
    <script src="property-management.js"></script>
</body>
</html>
